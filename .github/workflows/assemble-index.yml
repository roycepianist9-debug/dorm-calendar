name: Assemble dorm calendar index
on:
  push:
    paths:
      - "fragments/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: assemble-index
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble full index.html from gzip+base64 parts
        id: assemble
        run: |
          set -euo pipefail
          cp index.html /tmp/prev-index.html || true
          # Publishers push fragments in N batches (1/N .. N/N). Each batch
          # triggers this workflow; batches 1..N-1 have an incomplete gzip
          # stream and used to fail the job (GitHub failure emails / false
          # COS alarms). Soft-skip until the final batch makes a valid page.
          if ! cat fragments/index.*.b64 | base64 -d | gunzip > /tmp/new-index.html 2>/tmp/gunzip.err; then
            echo "Incomplete fragment set (multi-batch push in progress) — soft skip"
            cat /tmp/gunzip.err || true
            echo "incomplete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mv /tmp/new-index.html index.html
          python3 - <<'PY'
          from pathlib import Path
          h = Path("index.html").read_text(encoding="utf-8")
          assert h.startswith("<!DOCTYPE html>"), h[:40]
          for m in ["Keti", "IMFURAYACU", "Ngango", "Muhammad", "Breakdown", "chart-data"]:
              assert m in h, m
          for bad in ["fateh", "Denys"]:
              assert bad not in h, bad
          print("size", len(h.encode()))
          PY
          echo "incomplete=false" >> "$GITHUB_OUTPUT"
      - name: Refuse rollbacks to older calendar data
        if: steps.assemble.outputs.incomplete != 'true'
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          rx = re.compile(r'<meta name="calendar-version" content="([0-9TZ:-]+)">')
          new = rx.search(Path("index.html").read_text(encoding="utf-8"))
          p = Path("/tmp/prev-index.html")
          old = rx.search(p.read_text(encoding="utf-8")) if p.exists() else None
          allow = "[allow-rollback]" in (os.environ.get("HEAD_MSG") or "")
          print("prev version", old and old.group(1), "new version", new and new.group(1), "allow", allow)
          if old and not allow:
              if not new:
                  raise SystemExit("REFUSED: new index has no calendar-version but live has " + old.group(1) + " (looks like an old LAST_GOOD). Patch on top of live, or add [allow-rollback] to the commit message after Royce OK.")
              if new.group(1) < old.group(1):
                  raise SystemExit("REFUSED: new calendar-version " + new.group(1) + " is older than live " + old.group(1) + ". Patch on top of live, or add [allow-rollback] after Royce OK.")
          PY
      - name: Commit assembled index
        if: steps.assemble.outputs.incomplete != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change"
            exit 0
          fi
          V=$(grep -o 'calendar-version" content="[^"]*' index.html | cut -d'"' -f3 || true)
          git commit -m "Assemble index.html from fragments (calendar-version ${V:-none})"
          git push
